name: Check

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository under $GITHUB_WORKSPACE
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-05-28
          components: rustfmt

      - name: cargo fmt --check
        run: cargo +nightly-2026-05-28 fmt --check

  taplo:
    name: taplo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository under $GITHUB_WORKSPACE
        uses: actions/checkout@v4

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: taplo fmt --check
        run: taplo fmt --check --config .config/taplo.toml

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Check-out repository under $GITHUB_WORKSPACE
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Utilize Shared Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-cache
          cache-on-failure: true

      - name: Install solidity compiler
        run: |
          VERSION="0.8.33"
          ASSET_URL="https://github.com/argotorg/solidity/releases/download/v$VERSION/solc-static-linux"
          echo "Downloading solc v$VERSION from $ASSET_URL"
          mkdir -p "$HOME/.cargo/bin"
          curl -Lsf --show-error -o "$HOME/.cargo/bin/solc" "$ASSET_URL"
          chmod +x "$HOME/.cargo/bin/solc"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/solc" --version

      - name: Install revive compiler (Polkadot VM)
        run: |
          VERSION="0.6.0"
          ASSET_URL="https://github.com/paritytech/revive/releases/download/v$VERSION/resolc-x86_64-unknown-linux-musl"
          echo "Downloading resolc v$VERSION from $ASSET_URL"
          mkdir -p "$HOME/.cargo/bin"
          curl -Lsf --show-error -o "$HOME/.cargo/bin/resolc" "$ASSET_URL"
          chmod +x "$HOME/.cargo/bin/resolc"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/resolc" --version

      - name: Cargo clippy
        run: |
          source scripts/ci-package-excludes.sh
          cargo clippy --workspace --all-targets "${CI_PACKAGE_EXCLUDES[@]}" -- -D warnings

  zepter:
    name: zepter
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository under $GITHUB_WORKSPACE
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install zepter
        run: cargo install zepter@1.82.1 --locked

      - name: zepter run check
        run: zepter run check
